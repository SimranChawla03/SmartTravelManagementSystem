services:
  - type: web
    name: smart-travel-management-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_NAME
        value: smart_travel_db
      - key: MONGODB_URI
        sync: false
